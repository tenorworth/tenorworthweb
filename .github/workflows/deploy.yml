name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-check:
    # Fast fail on PRs/pushes before touching the server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            marketing/package-lock.json
            frontend/package-lock.json
      - name: Build marketing site
        working-directory: marketing
        run: npm ci && npm run build
      - name: Build app frontend
        working-directory: frontend
        run: npm ci && npm run build

  deploy:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "REPO_DIR='$DEPLOY_REPO_DIR' REPO_URL='$REPO_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ ! -d "$REPO_DIR/.git" ]; then
            echo ">>> First run: cloning $REPO_URL -> $REPO_DIR"
            git clone "$REPO_URL" "$REPO_DIR"
          fi
          cd "$REPO_DIR"
          git fetch --all --prune
          git reset --hard origin/main
          bash deploy/update.sh
          REMOTE
