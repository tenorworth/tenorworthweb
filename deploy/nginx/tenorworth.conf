# ============================================================
# Nginx server blocks for Tenorworth
# ------------------------------------------------------------
# - tenorworth.com / www.tenorworth.com → MARKETING site (Astro static)
# - app.tenorworth.com                  → APP SPA (React/Vite build)
#                                         /api/, /health → backend :8002
#
# Lives alongside supremoagent.conf on the same VPS. It only claims
# the tenorworth.com hostnames, so it never interferes with the
# SupremoAgent blocks (whose backend is on :8001).
#
# Installed by deploy/update.sh ONLY when the Let's Encrypt cert
# exists at /etc/letsencrypt/live/tenorworth.com/. Before that,
# update.sh installs tenorworth-http.conf instead.
#
# Issue the cert (once, after all three A records point here):
#   sudo certbot certonly --nginx \
#     -d tenorworth.com -d www.tenorworth.com -d app.tenorworth.com
# (certonly so certbot does not rewrite this file — the repo owns it.)
# ============================================================

upstream tenorworth_backend {
    server 127.0.0.1:8002;
    keepalive 16;
}

# HTTP → HTTPS for every hostname.
server {
    listen 80;
    listen [::]:80;
    server_name tenorworth.com www.tenorworth.com app.tenorworth.com;
    return 301 https://$host$request_uri;
}

# www → apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tenorworth.com;
    ssl_certificate     /etc/letsencrypt/live/tenorworth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenorworth.com/privkey.pem;
    return 301 https://tenorworth.com$request_uri;
}

# ============================================================
# Block 1 — MARKETING (tenorworth.com)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tenorworth.com;

    ssl_certificate     /etc/letsencrypt/live/tenorworth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenorworth.com/privkey.pem;

    root /var/www/tenorworth/marketing/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/plain application/json application/javascript
               text/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Web app manifest — not in nginx's default mime.types.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Astro emits <route>.html (build.format = 'file'): /services → services.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Content-hashed bundles: cache forever.
    location ~* ^/_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Stable top-level assets (favicons, og-image): short cache + revalidate.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    error_page 404 /404.html;
}

# ============================================================
# Block 2 — APP SPA (app.tenorworth.com)
# ============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.tenorworth.com;

    ssl_certificate     /etc/letsencrypt/live/tenorworth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tenorworth.com/privkey.pem;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css text/plain application/json application/javascript
               text/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Backend API (502 until the backend service exists — harmless).
    location /api/ {
        proxy_pass http://tenorworth_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
    location /health {
        proxy_pass http://tenorworth_backend;
        proxy_set_header Host $host;
    }

    # Web app manifest — not in nginx's default mime.types.
    location = /site.webmanifest {
        root /var/www/tenorworth/frontend/dist;
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # React SPA.
    location / {
        root /var/www/tenorworth/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/assets/ {
        root /var/www/tenorworth/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        root /var/www/tenorworth/frontend/dist;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }
}
