# Bootstrap config: HTTP only. Used until the Let's Encrypt cert exists so
# that `nginx -t` passes and certbot's HTTP-01 challenge can be answered.
# deploy/update.sh swaps this for tenorworth.conf automatically once
# /etc/letsencrypt/live/tenorworth.com/fullchain.pem appears.
server {
    listen 80;
    listen [::]:80;
    server_name tenorworth.com www.tenorworth.com;
    root /var/www/tenorworth/marketing/dist;
    index index.html;
    location / { try_files $uri $uri.html $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name app.tenorworth.com;
    root /var/www/tenorworth/frontend/dist;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
